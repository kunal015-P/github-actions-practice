name: Hello

# Defines when the workflow should run
on:
  workflow_dispatch:

# Defines what the workflow should do
jobs:
  # First Job
  say-hello:
    # Creates an ephemeral container running Ubuntu
    runs-on: ubuntu-latest

    # Defines the steps to execute
    steps:
      - name: Say hello to Kunal
        run: echo "Hello Kunal"
